# LocalHub TV (the Fire TV / Android TV app) and the TV back end's tests.
# Debug-signed: no signing secrets. A build that compiles proves it compiles, not that it runs on a TV.
# On a v* tag the APK is attached to that release as LocalHub-TV.apk, next to LocalHub-Setup.exe
# (the desktop workflow creates the release; this one waits for it).
name: TV

on:
  push:
    # Branches as well as tags: with only tags listed, GitHub runs this for tags alone.
    branches: ['**']
    paths:
      - 'tv/**'
      - 'tv.mjs'
      - 'test/tv/**'
      - '.github/workflows/tv.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A glob, not a folder: Node 22 doesn't expand a directory argument to --test.
      - run: node --test "test/tv/*.test.mjs"

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        run: gradle -p tv/android :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp tv/android/app/build/outputs/apk/debug/app-debug.apk out/LocalHub-TV.apk
          ls -lh out/LocalHub-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: localhub-tv-apk
          path: out/LocalHub-TV.apk
          retention-days: 14
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "waiting for release $GITHUB_REF_NAME ($i)"; sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" out/LocalHub-TV.apk --repo "$GITHUB_REPOSITORY" --clobber

  # Proves the APK starts and runs: boots an Android TV emulator, installs it, opens it unpaired
  # (so it shows the bundled home screen from http://localhub.tv/) and checks it stays up, stays in
  # front, never crashes and really draws the UI. The checks are in test/tv/emulator/smoke.sh.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Android TV images are x86 up to API 34 (x86_64 only from 36). 30 is Android 11.
      API_LEVEL: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # its own fetch and WebSocket talk to the WebView over DevTools
      - uses: actions/download-artifact@v4
        with:
          name: localhub-tv-apk
          path: out
      # Hardware acceleration for the emulator: without /dev/kvm access it won't boot in time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # No AVD cache: the image cold-boots in about 25 s with KVM, and a cached snapshot would cost
      # an extra emulator boot to make on every cache miss for little gain.
      # The runner runs each script line on its own, so the checks live in one script.
      - name: Install, start and check LocalHub TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash test/tv/emulator/smoke.sh out/LocalHub-TV.apk out/emulator
      # Screenshots, logcat and the page's state, pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localhub-tv-emulator
          path: out/emulator
          retention-days: 14
          if-no-files-found: warn
