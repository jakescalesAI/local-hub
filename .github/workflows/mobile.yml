# Debug builds of the mobile app. No signing, no secrets, nothing is released or uploaded to a store.
# A build that compiles proves it compiles, not that the app works.
name: Mobile

on:
  push:
    branches: [claude/mobile-app, lh/lh-mobile/store]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Which build to run
        type: choice
        options: [android, ios, pictures]
        default: android
      ios_runner:
        description: Which macOS runner the iOS build waits for
        type: choice
        options: [macos-15, macos-26, macos-latest]
        default: macos-15

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name == 'push' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:dev
      - run: npm run test:ui
      - name: Keep the UI test's screenshots if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: mobile/test/ui/out
          retention-days: 3
          if-no-files-found: ignore
      - run: npm run licenses
      - run: npm run build
      - run: npx cap sync android
      - name: Build the debug APK
        working-directory: mobile/android
        run: sh ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Show what was built
        working-directory: mobile/android/app/build/outputs/apk/debug
        run: |
          ls -l
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2" dump badging app-debug.apk | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|uses-permission|application-label:)" | tee "$RUNNER_TEMP/badging.txt"
          ! grep -E "RECORD_AUDIO|MODIFY_AUDIO_SETTINGS|ACCESS_(COARSE|FINE)_LOCATION" "$RUNNER_TEMP/badging.txt" || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      # Unsigned and kept here: this checks R8 and what ships. It isn't uploaded anywhere.
      - name: Build the shrunk release APK, unsigned
        working-directory: mobile/android
        run: sh ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Check what the release APK carries
        working-directory: mobile/android/app/build/outputs/apk/release
        run: |
          ls -l
          apk=app-release-unsigned.apk
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$aapt" dump badging "$apk" | grep "package: name='$(node -p "require(process.env.GITHUB_WORKSPACE + '/mobile/app-ids.json').android")'"
          "$aapt" dump badging "$apk" | grep -E "uses-permission" | tee "$RUNNER_TEMP/release.txt"
          ! grep -E "RECORD_AUDIO|MODIFY_AUDIO_SETTINGS|ACCESS_(COARSE|FINE)_LOCATION" "$RUNNER_TEMP/release.txt" || exit 1
          "$aapt" dump xmltree --file AndroidManifest.xml "$apk" | grep -E "debuggable|HubWidgetProvider" | tee "$RUNNER_TEMP/manifest.txt"
          grep -q HubWidgetProvider "$RUNNER_TEMP/manifest.txt"
          ! grep -E 'debuggable.*(true|0xffffffff)' "$RUNNER_TEMP/manifest.txt" || exit 1
          unzip -p "$apk" assets/public/app.js > "$RUNNER_TEMP/app.js"
          test -s "$RUNNER_TEMP/app.js"
          ! grep -E "__hubTest|__testScan|__testLock|__hubOpened|__hubClosed|__DEV__|__LOCAL_HTTP__" "$RUNNER_TEMP/app.js" || exit 1
          sh "$GITHUB_WORKSPACE/mobile/scripts/check-apk-network.sh" "$aapt" "$apk"
          # The check has to catch something: the debug APK allows this machine over HTTP, so it must fail there.
          if sh "$GITHUB_WORKSPACE/mobile/scripts/check-apk-network.sh" "$aapt" ../debug/app-debug.apk > "$RUNNER_TEMP/nsc-debug.txt"; then exit 1; fi
          grep -q "allows plain HTTP" "$RUNNER_TEMP/nsc-debug.txt"
      # The bundle Play takes. Unsigned here: the signed one is built where the upload key lives, never in this repo.
      - name: Build the release bundle, unsigned
        working-directory: mobile/android
        run: sh ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Check what the bundle carries
        working-directory: mobile/android/app/build/outputs/bundle/release
        run: |
          ls -l
          aab=app-release.aab
          unzip -l "$aab" | grep -q "base/manifest/AndroidManifest.xml"
          unzip -l "$aab" | grep -q "base/assets/public/index.html"
          ! unzip -l "$aab" | grep -q "META-INF/.*\.\(RSA\|EC\|DSA\)$" || exit 1
          unzip -p "$aab" base/assets/public/app.js > "$RUNNER_TEMP/aab-app.js"
          test -s "$RUNNER_TEMP/aab-app.js"
          ! grep -E "__hubTest|__testScan|__testLock|__hubOpened|__hubClosed|__DEV__|__LOCAL_HTTP__" "$RUNNER_TEMP/aab-app.js" || exit 1
  # The minified build on an emulator, against the real Hub, with real biometric prompts. It proves
  # Android behaviour on an emulator: not hardware, and nothing about iOS.
  android-device:
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'pictures'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - name: Build the debuggable APK, for reading the app's files at the end
        run: |
          npm run build
          npx cap sync android
          (cd android && sh ./gradlew assembleDebug --no-daemon --stacktrace)
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
      - name: Build the minified APK, able to reach the emulator's host
        run: |
          node build.mjs --local-http
          npx cap sync android
          (cd android && sh ./gradlew assembleMinified --no-daemon --stacktrace)
          apk=android/app/build/outputs/apk/minified/app-minified.apk
          unzip -p "$apk" assets/public/app.js > "$RUNNER_TEMP/app.js"
          ! grep -E "__hubTest|__testScan|__testLock|__hubOpened|__hubClosed|__DEV__|__LOCAL_HTTP__" "$RUNNER_TEMP/app.js" || exit 1
      - name: Install the emulator
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          # The builds leave about 2 GB free, and the emulator wants several for its data.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h "$HOME" | tail -1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0 > /dev/null
          # The runner's XDG_CONFIG_HOME sends avdmanager and the emulator to different folders.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$manager/sdkmanager" --licenses > /dev/null || true
          # A download comes back corrupt now and then. That's the mirror, so it gets one more try.
          packages='platform-tools emulator system-images;android-33;default;x86_64'
          "$manager/sdkmanager" --install $packages > /dev/null || "$manager/sdkmanager" --install $packages > /dev/null
          echo no | "$manager/avdmanager" create avd -n hub -k "system-images;android-33;default;x86_64" -d pixel_5
          echo "disk.dataPartition.size=3G" >> "$ANDROID_AVD_HOME/hub.avd/config.ini"
          # No on-screen keyboard: nothing here needs one, and drawing it wedged these runners.
          echo "hw.keyboard=yes" >> "$ANDROID_AVD_HOME/hub.avd/config.ini"
      - name: Start the emulator
        run: |
          ls -l /dev/kvm
          emulator -accel-check | tail -2
          emulator -list-avds
          nohup emulator -avd hub -no-window -no-audio -no-boot-anim -no-snapshot -partition-size 3072 -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          booted=""
          # Booting took from under 6 minutes to over 8 on these two-core runners.
          for _ in $(seq 1 180); do
            booted=$(timeout 20 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$booted" = "1" ] && break
            kill -0 "$emulator_pid" 2>/dev/null || { echo "The emulator exited."; break; }
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            adb devices
            tail -80 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          # Booted isn't the same as ready. The package service can still refuse an install.
          timeout 300 sh -c 'until adb shell cmd package list packages android 2>/dev/null | grep -q "package:android"; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
      - name: Run the app against the real Hub
        env:
          PICTURES: ${{ inputs.platform == 'pictures' && '1' || '' }}
        run: |
          for try in 1 2 3; do
            adb install android/app/build/outputs/apk/minified/app-minified.apk && break
            [ "$try" != 3 ] || exit 1
            sleep 30
          done
          adb logcat -G 8M
          adb logcat -c
          node test/device/android-e2e.mjs .. "$RUNNER_TEMP/app-debug.apk" test/device/out
      - name: Note what the system did, if the run failed
        if: failure()
        run: |
          mkdir -p test/device/out
          free -m
          df -h "$HOME" | tail -1
          pgrep -a emulator | cut -c1-80 || echo "The emulator is gone."
          adb devices
          tail -60 "$RUNNER_TEMP/emulator.log" | tee test/device/out/emulator.log
          timeout 60 adb logcat -d | grep -E "ActivityTaskManager|Fingerprint|Biometric|ConfirmDevice|ConfirmLock|LockSettings|E AndroidRuntime|FATAL" | grep -v CoreBackPreview | tail -600 > test/device/out/system.log || true
      - name: Keep the emulator's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-run
          path: mobile/test/device/out
          retention-days: 3
          if-no-files-found: warn

  # A push to the store branch runs this too, so its iOS build doesn't wait on a dispatch.
  ios:
    if: github.event_name == 'push' || inputs.platform == 'ios'
    # macos-26 sat queued with no runner free on three runs; macos-15 is the generally available image.
    # A dispatch can still pick another label.
    runs-on: ${{ inputs.ios_runner || 'macos-15' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Runners carry several Xcodes. Capacitor 8 and App Store uploads need Xcode 26 or later, so take the
      # newest released one and stop here, with a clear reason, if the runner has none.
      - name: Use the newest released Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate' | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -version | grep -qE '^Xcode (2[6-9]|[3-9][0-9])' || { echo "Needs Xcode 26 or later; this runner's newest is $xcode"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator, unsigned
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      # The App Store build is for devices, which compile a little differently from the simulator.
      - name: Build for a device, unsigned
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS' -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO build
      - name: Check the share extension is inside the app
        run: |
          app=build/Build/Products/Debug-iphonesimulator/App.app
          du -sh "$app"
          test -d "$app/PlugIns/ShareExtension.appex"
          test -f "$app/PlugIns/ShareExtension.appex/PrivacyInfo.xcprivacy"
          plutil -p "$app/Info.plist" | grep -E "CFBundleIdentifier|CFBundleURLSchemes"
          id=$(node -p "require('./app-ids.json').ios")
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = "$id"
          test "$(plutil -extract CFBundleIdentifier raw "$app/PlugIns/ShareExtension.appex/Info.plist")" = "$id.share"
          test "$(plutil -extract CFBundleIdentifier raw "$app/PlugIns/HubWidget.appex/Info.plist")" = "$id.widget"
          for key in NSCameraUsageDescription NSFaceIDUsageDescription NSLocalNetworkUsageDescription; do
            plutil -p "$app/Info.plist" | grep "$key"
          done
          test -f "$app/PlugIns/HubWidget.appex/PrivacyInfo.xcprivacy"
          plutil -p "$app/PlugIns/HubWidget.appex/Info.plist" | grep "CFBundleIdentifier"
          plutil -p "$app/PlugIns/HubWidget.appex/Info.plist" | grep "com.apple.widgetkit-extension"
          for bundle in "$app" "$app/PlugIns/ShareExtension.appex" "$app/PlugIns/HubWidget.appex"; do
            plutil -p "$bundle/Info.plist" | grep -E "CFBundle(ShortVersionString|Version)"
          done
          ! grep -E "__hubTest|__testScan|__testLock|__hubOpened|__hubClosed|__DEV__|__LOCAL_HTTP__" "$app/public/app.js" || exit 1
      # Reported on its own: a failure here does not undo the build result above.
      - name: Launch it once and take a screenshot
        continue-on-error: true
        timeout-minutes: 6
        run: |
          device=$(xcrun simctl list devices available -j | node -e "
            const all = JSON.parse(require('fs').readFileSync(0, 'utf8')).devices
            const ios = Object.keys(all).filter(k => k.includes('iOS')).sort().reverse()
            console.log(ios.flatMap(k => all[k]).find(d => d.name.startsWith('iPhone')).udid)")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device" "$(node -p "require('./app-ids.json').ios")"
          sleep 20
          xcrun simctl spawn "$device" launchctl list | grep "$(node -p "require('./app-ids.json').ios")"
          xcrun simctl io "$device" screenshot launch.png
      # Reported on its own too. A simulator launch shows the layout, not what a real iPad does.
      - name: Launch it on an iPad simulator and take a screenshot
        continue-on-error: true
        timeout-minutes: 8
        run: |
          device=$(xcrun simctl list devices available -j | node -e "
            const all = JSON.parse(require('fs').readFileSync(0, 'utf8')).devices
            const ios = Object.keys(all).filter(k => k.includes('iOS')).sort().reverse()
            console.log(ios.flatMap(k => all[k]).find(d => d.name.startsWith('iPad')).udid)")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device" "$(node -p "require('./app-ids.json').ios")"
          sleep 20
          xcrun simctl io "$device" screenshot launch-ipad.png
          xcrun simctl openurl "$device" localhub://action/status
          sleep 5
          xcrun simctl io "$device" screenshot action-ipad.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch
          path: |
            mobile/launch.png
            mobile/launch-ipad.png
            mobile/action-ipad.png
          if-no-files-found: warn
          retention-days: 3
