<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>LocalHub TV · Assistant (dev)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./hub.svg">
<link rel="stylesheet" href="./assistant.css">
<!--
  A harness for assistant.js on its own: the 1920×1080 canvas scaled to the window, a stand-in sidebar (x 0..140) and
  the Assistant section (x 140..1920), driven by the keyboard as the TV shell drives it with the remote.

    Arrows move · Enter is OK · Esc (or Backspace outside the field) is Back · Space (outside the field) is ⏯ talk

  Open it from a running hub: http://localhost:3100/tv/assistant-dev.html
    ?speech=Off|Always|After voice   "Read answers aloud" (default After voice)
    ?nomic=1                         pretend to be a Fire TV whose mic is kept for Alexa (window.HubVoice rejects)
  window.Assistant is the module, for poking at it from DevTools.
-->
<style>
  :root {
    --blue: #0a84ff; --green: #30d158; --red: #ff453a; --label: #fff; --label-2: rgba(235, 235, 245, .6);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--font); color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(.5); transform-origin: 50% 50%; background: #0b0b0e; overflow: hidden; }
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 180px; background: #050507; box-shadow: 1px 0 0 rgba(255, 255, 255, .06); }
  .side i { width: 84px; height: 84px; border-radius: 26px; display: grid; place-items: center; font: 600 15px/1 var(--font); font-style: normal; color: rgba(255, 255, 255, .55); background: rgba(255, 255, 255, .06); }
  .side i.on { color: #fff; background: rgba(255, 255, 255, .16); }
  .side.f i.on { color: #000; background: #fff; }
  .side i b { position: absolute; margin: -54px 0 0 54px; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); display: none; }
  .side i.busy b { display: block; }
  #assistant { position: absolute; left: 140px; top: 0; width: 1780px; height: 1080px; }
  .toast { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); padding: 16px 28px; border-radius: 24px; font: 600 26px/1.3 var(--font); background: #2c2c32; opacity: 0; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <nav class="side" id="side"><i>Home</i><i class="on" id="sideAi">Assistant<b></b></i><i>Browser</i><i>Apps</i><i>Settings</i></nav>
  <section id="assistant" aria-label="Assistant"></section>
  <div class="toast" id="toast"></div>
</div>
<script>
  (function () {
    function fit() {
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.getElementById("stage").style.transform = "translate(-50%,-50%) scale(" + s + ")";
    }
    fit();
    window.addEventListener("resize", fit);
  })();
</script>
<script type="module">
  import * as Assistant from "./assistant.js";
  window.Assistant = Assistant;
  const qs = new URLSearchParams(location.search);
  const $ = (s) => document.querySelector(s);

  let toastTimer = 0;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
  }

  // A Fire TV without an app-usable mic: listen() rejects, as LocalHub TV's HubVoice does there.
  if (qs.get("nomic") === "1") {
    window.HubVoice = {
      listen: () => new Promise((_, reject) => setTimeout(() => reject(new Error("This TV has no microphone LocalHub can use. Fire TV keeps the remote's mic for Alexa. Or say “Alexa, ask local hub …”.")), 700)),
      stop() {}, cancel() {}, speak() {}, hush() {},
    };
  }

  const zone = { side: false };
  Assistant.init({
    el: $("#assistant"),
    toast,
    native: () => undefined,
    NATIVE: null,
    intercept(text) {
      const m = /^(?:open|launch|play|put on)\s+(.+)$/i.exec(text.trim());
      if (!m) return false;
      toast(`Opening ${m[1]} on the TV (the shell does this)`);
      return true;
    },
    speechMode: () => qs.get("speech") || "After voice",
    onActivity: (on) => $("#sideAi").classList.toggle("busy", on),
  });
  Assistant.show();

  const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Enter: "enter", Escape: "back", Backspace: "back", " ": "ai", MediaPlayPause: "ai" };
  document.addEventListener("keydown", (e) => {
    const inField = document.activeElement?.classList?.contains("as-input");
    // Typing in the field: letters, Space and Backspace are the field's.
    if (inField && (e.key === " " || e.key === "Backspace" || e.key.length === 1)) return;
    const name = KEYS[e.key];
    if (!name) return;
    e.preventDefault();
    if (zone.side) {
      if (name === "right" || name === "enter") { zone.side = false; $("#side").classList.remove("f"); Assistant.focus(); }
      return;
    }
    if (!Assistant.key(name) && name === "left") {
      zone.side = true;
      $("#side").classList.add("f");
      document.activeElement?.blur?.();
    }
  }, true);
</script>
</body>
</html>
