<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Launcher</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <form class="launcher" id="form">
    <input id="query" type="text" placeholder="Web address, or Enter to open your Hub" aria-label="Web address" autocomplete="off" spellcheck="false" autofocus>
    <p>The full launcher isn't available from your Hub yet.</p>
    <footer>
      <span>Enter to open · Esc to close</span>
      <button type="button" id="open-hub">Open Hub</button>
    </footer>
  </form>
  <script src="launcher.js"></script>
</body>
</html>
