<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Settings</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <form class="settings" id="form">
    <label>
      Launcher hotkey
      <input id="hotkey" type="text" readonly placeholder="Press a key combination">
    </label>
    <label>
      Hub port
      <input id="port" type="number" min="1" max="65535" required>
    </label>
    <p class="error" id="error" role="alert"></p>
    <div class="actions">
      <button class="primary" type="submit">Save</button>
      <button type="button" id="close">Close</button>
    </div>
  </form>
  <script src="settings.js"></script>
</body>
</html>
